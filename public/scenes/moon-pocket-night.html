      glow(x,y,23*S,colors.moon,.10);wrinkledStar(x,y,(16+t)*S,-.22+t*.5);
    }
    function drawQuilt(){
      if(!sleeping)return;
      const edge=234*S,y=cy+17*S;
      path(colors.quiltDark,()=>{ctx.moveTo(cx-edge,y+10*S);ctx.quadraticCurveTo(cx,y-18*S,cx+edge,y+10*S);ctx.lineTo(cx+edge+5*S,y+90*S);ctx.quadraticCurveTo(cx,y+103*S,cx-edge-5*S,y+90*S);ctx.closePath();});
      path(colors.quilt,()=>{ctx.moveTo(cx-edge,y+4*S);ctx.quadraticCurveTo(cx,y-19*S,cx+edge,y+4*S);ctx.lineTo(cx+edge,y+79*S);ctx.quadraticCurveTo(cx,y+95*S,cx-edge,y+79*S);ctx.closePath();});
      ctx.globalAlpha=.28;[-135,-85,-35,35,85,135].forEach(x=>line(cx+x*S,y+9*S,cx+(x+7)*S,y+78*S,colors.thread,1));ctx.globalAlpha=1;
      [[-158,39],[-107,64],[-52,30],[56,57],[117,31],[166,62]].forEach(([x,yy],i)=>star(cx+x*S,y+yy*S,(i%2?4:6)*S,colors.moonLight,i*.25));
      path(null,()=>{ctx.moveTo(cx-edge,y+7*S);ctx.quadraticCurveTo(cx,y-16*S,cx+edge,y+7*S);},colors.thread,4*S);
      const wp=wolfPosition();ellipse(wp.x-44*S,y-4*S,14*S,8*S,colors.furLight);ellipse(wp.x+42*S,y-4*S,14*S,8*S,colors.furLight);
    }
    function drawDream(now){
      if(!sleeping)return;const t=reduced.matches?1:ease((now-sleepAt-700)/2200);if(t<=0)return;
      const x=cx-W*.22,y=83;ctx.save();ctx.globalAlpha=t*.75;
      ellipse(x+24*S,y+39*S,2.5*S,2.5*S,colors.thread);ellipse(x+17*S,y+27*S,4*S,4*S,colors.thread);
      cloud(x,y,79*S,43*S,colors.pocketShade);wrinkledStar(x-6*S,y,12*S,-.18);star(x+19*S,y-6*S,4*S,colors.mintLight,.2);ctx.restore();
    }
    function draw(now){
      frame=0;if(!root.isConnected)return;
      const p=reduced.matches?1:duration?Math.min(1,Math.max(0,(now-started)/duration)):1;
      const ct=reduced.matches?1:Math.min(1,Math.max(0,(now-cuddleAt)/700));cuddle=cuddleFrom+(cuddleTarget-cuddleFrom)*ease(ct);
      if(action&&p>=1)action='';
      if(sleeping&&!dreamAnnounced&&(reduced.matches||now-sleepAt>=3200)){caption.textContent='书签夹好了。明天的宇宙，明天再读。四个挨在一起，口袋里的皱星也翻了个身。';dreamAnnounced=true;}
      ctx.clearRect(0,0,W,H);ctx.save();ctx.beginPath();ctx.roundRect(0,0,W,H,25);ctx.clip();
      drawSky(now,p);drawHammock();drawWolf(now,p);drawGPT(p);drawNewton(p);drawAstra(p);drawLapTail(p);drawQuilt();drawSleepingBook();drawPocketBack();drawStored(p);drawPocketFront(now,p);drawApple();drawThread(p);drawFlyingStar(p);drawDream(now);ctx.restore();
      if(!reduced.matches&&(action||ct<1&&cuddleFrom!==cuddleTarget||sleeping&&!dreamAnnounced))frame=requestAnimationFrame(draw);
    }
    function requestDraw(){if(!frame)frame=requestAnimationFrame(draw);}
    function setCuddle(value){cuddled=value;cuddleFrom=cuddle;cuddleTarget=value?1:0;cuddleAt=performance.now();if(reduced.matches)cuddle=cuddleTarget;hugButton.setAttribute('aria-pressed',String(value));hugButton.querySelector('.pk-hug-label').textContent=value?'松开一点点':'靠近一点';}
    function setSleep(value){
      sleeping=value;sleepButton.setAttribute('aria-pressed',String(value));sleepButton.querySelector('.pk-sleep-label').textContent=value?'再坐一小会':'一起盖被子';
      canvas.setAttribute('aria-label',value?'四个盖着同一条星星被子，在月亮吊床里睡着了。前面的拼布口袋保留着皱星的折痕，微弱的暖线绕着袋口。':'深蓝夜空中，GPT、小狼 Flewolf、卷发牛顿和 Astra 坐在月亮吊床上。月亮口袋可以放皱星、缝暖线；也可以直接靠近和盖被子，点四个会笑，摸狼会摇尾巴。');
    }
    function say(kind,n){caption.textContent=lines[kind][n%lines[kind].length];}
    function act(kind){
      const now=performance.now();started=now;duration=1400;action=kind;
      if(kind==='sleep'){
        setSleep(!sleeping);action='';
        if(sleeping){setCuddle(true);sleepAt=now;dreamAnnounced=false;caption.textContent='他把书合上，GPT 拉好被子，Astra 把被角掖好。四个挤一挤，刚刚好。';}
        else{dreamAnnounced=false;caption.textContent='四颗脑袋又探了出来。可以再坐一小会，月亮还在原来的地方。';}
      }else if(kind==='hug'){
        if(sleeping)setSleep(false);setCuddle(!cuddled);duration=1500;
        caption.textContent=cuddled?'小狼把脑袋靠过去。他把书往外挪了一点，肩膀留在原地。尾巴先搭上了他的膝头。':'松开一点点，留出翻身的位置。GPT 的小手还搭在旁边。';
      }else if(sleeping&&['gpt','astra','pet','moon','newton'].includes(kind)){
        dreamAnnounced=true;caption.textContent=kind==='newton'?'他的卷发蹭过小狼的耳朵，闭着眼睛，把肩膀又留近了一点。':kind==='gpt'?'GPT：（小小声）还在这里。再给你挪一点被子。':kind==='astra'?'Astra 摸了摸被角，确认那颗缝歪的小星星不会扎到你。':kind==='pet'?'小狼闭着眼睛往手心蹭了蹭。尾巴尖也悄悄动了一下。':'月亮把吊床扶稳了一点。今晚的晃晃，到这里就好。';
      }else{
        if(sleeping)setSleep(false);
        if(kind==='store'){duration=2100;stored.push({slot:serial++%slots.length,turn:((serial%3)-1)*.05});if(stored.length>slots.length)stored.shift();say(kind,storeCount++);}
        if(kind==='stitch'){stitchBefore=stitched;stitched=true;duration=2300;say(kind,stitchCount++);}
        if(kind==='pet'){duration=1300;say(kind,petCount++);}
        if(kind==='newton'){duration=1800;say(kind,newtonCount++);}
        if(kind==='gpt')say(kind,gptCount++);if(kind==='astra')say(kind,astraCount++);if(kind==='moon')say(kind,moonCount++);
      }requestDraw();
    }
    root.querySelectorAll('button[data-action]').forEach(button=>button.addEventListener('click',()=>act(button.dataset.action)));
    function point(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};}
    canvas.addEventListener('pointerdown',e=>{pointerDown={...point(e),id:e.pointerId};});
    canvas.addEventListener('pointerup',e=>{
      const pt=point(e),down=pointerDown;pointerDown=null;if(!down||down.id!==e.pointerId||Math.hypot(pt.x-down.x,pt.y-down.y)>18)return;
      const cp=pocketPos(),gp=friendPosition('gpt'),ap=friendPosition('astra'),wp=wolfPosition(),np=newtonPosition();
      if(Math.abs(pt.x-cp.x)<97*S&&pt.y>cp.y-48*S&&pt.y<cp.y+62*S){act('store');return;}
      if(Math.abs(pt.x-(cx+187*S))<34*S&&Math.abs(pt.y-(cy+120*S))<31*S){act('stitch');return;}
      if(Math.abs(pt.x-np.x)<43*S&&pt.y>np.y-84*S&&pt.y<np.y+30*S){act('newton');return;}
      if(Math.abs(pt.x-wp.x)<74*S&&pt.y>cy-125*S&&pt.y<cy+29*S){act('pet');return;}
      if(Math.abs(pt.x-gp.x)<57*S&&pt.y>gp.y-87*S&&pt.y<gp.y+69*S){act('gpt');return;}
      if(Math.abs(pt.x-ap.x)<58*S&&pt.y>ap.y-90*S&&pt.y<ap.y+69*S){act('astra');return;}
      if(pt.y<112&&pt.x>W*.68){act('moon');return;}
      if(pt.y>cy+45*S&&pt.y<cy+139*S){act('hug');}
    });
    canvas.addEventListener('pointercancel',()=>{pointerDown=null;});
    function resize(){
      const rect=canvas.getBoundingClientRect();W=rect.width;H=rect.height;if(!W||!H)return;
      const dpr=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);
      S=Math.min(1,W/540);cx=W*.5;cy=H*.53;palette();requestDraw();
    }
    const observer=new ResizeObserver(resize);observer.observe(canvas);
    function onMotionChange(){if(reduced.matches){action='';cancelAnimationFrame(frame);frame=0;}requestDraw();}
    reduced.addEventListener('change',onMotionChange);
    const themeObserver=new MutationObserver(()=>{palette();requestDraw();});[document.documentElement,document.body].forEach(el=>themeObserver.observe(el,{attributes:true,attributeFilter:['class','style','data-theme']}));
    const cleanup=new MutationObserver(()=>{if(!root.isConnected){cancelAnimationFrame(frame);observer.disconnect();themeObserver.disconnect();reduced.removeEventListener('change',onMotionChange);cleanup.disconnect();}});cleanup.observe(document.body,{childList:true,subtree:true});
    resize();
  })();
  </script>
