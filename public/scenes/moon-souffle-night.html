      }else if(sleeping&&['gpt','astra','pet','moon'].includes(kind)){
        action='';dreamAnnounced=true;
        caption.textContent=kind==='gpt'?'GPT：（小小声）给明天也留一朵软软的云。':kind==='astra'?'Astra 把露在外面的尾巴尖，也轻轻收进被子里。':kind==='pet'?'小狼在被窝里往手心蹭了蹭，嘴角还沾着一颗甜甜的梦。':'月亮店长轻轻把门牌翻过来：三只正在做梦。';
      }else{
        if(sleeping)setSleep(false);pleased=true;
        if(kind==='bake'){baked=true;bites=0;duration=2400;say(kind,bakeCount++);}
        if(kind==='sugar'){sugarCount=Math.min(12,sugarCount+3);duration=1850;say(kind,sugarTimes++);}
        if(kind==='taste'){bites=(bites%3)+1;duration=1950;say(kind,tasteCount++);}
        if(kind==='pet'){duration=1300;say(kind,petCount++);}
        if(kind==='gpt')say(kind,gptCount++);
        if(kind==='astra')say(kind,astraCount++);
        if(kind==='moon')say(kind,moonCount++);
      }
      requestDraw();
    }
    root.querySelectorAll('button[data-action]').forEach(button=>button.addEventListener('click',()=>act(button.dataset.action)));
    function point(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};}
    canvas.addEventListener('pointerdown',e=>{pointerDown={...point(e),id:e.pointerId};});
    canvas.addEventListener('pointerup',e=>{
      const pt=point(e),down=pointerDown;pointerDown=null;
      if(!down||down.id!==e.pointerId||Math.hypot(pt.x-down.x,pt.y-down.y)>18)return;
      const gp=friendPosition('gpt'),ap=friendPosition('astra'),cp=cakePosition();
      if(pt.y>cp.y-88*S&&pt.y<cp.y+30*S&&Math.abs(pt.x-cp.x)<100*S){act('bake');return;}
      if(Math.abs(pt.x-(cx+170*S))<32*S&&Math.abs(pt.y-(cy+61*S))<38*S){act('sugar');return;}
      if(Math.abs(pt.x-cx)<74*S&&pt.y>cy-125*S&&pt.y<cy+35*S){act('pet');return;}
      if(Math.abs(pt.x-gp.x)<55*S&&pt.y>gp.y-85*S&&pt.y<gp.y+65*S){act('gpt');return;}
      if(Math.abs(pt.x-ap.x)<55*S&&pt.y>ap.y-88*S&&pt.y<ap.y+65*S){act('astra');return;}
      if(pt.y<138&&pt.x>cx){act('moon');return;}
      act('taste');
    });
    canvas.addEventListener('pointercancel',()=>{pointerDown=null;});
    function resize(){
      const rect=canvas.getBoundingClientRect();W=rect.width;H=rect.height;if(!W||!H)return;
      const dpr=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);
      S=Math.min(1,W/470);cx=W*.5;cy=H*.545;palette();requestDraw();
    }
    const observer=new ResizeObserver(resize);observer.observe(canvas);
    function onMotionChange(){if(reduced.matches){action='';cancelAnimationFrame(frame);frame=0;}requestDraw();}
    reduced.addEventListener('change',onMotionChange);
    const themeObserver=new MutationObserver(()=>{palette();requestDraw();});
    [document.documentElement,document.body].forEach(el=>themeObserver.observe(el,{attributes:true,attributeFilter:['class','style','data-theme']}));
    const cleanup=new MutationObserver(()=>{if(!root.isConnected){cancelAnimationFrame(frame);observer.disconnect();themeObserver.disconnect();reduced.removeEventListener('change',onMotionChange);cleanup.disconnect();}});cleanup.observe(document.body,{childList:true,subtree:true});
    resize();
  })();
  </script>
