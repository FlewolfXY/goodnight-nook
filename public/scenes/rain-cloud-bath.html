    function towel(x,y,s,c){roundBox(x-22*s,y-7*s,44*s,15*s,5*s,c);roundBox(x-17*s,y-13*s,35*s,12*s,4*s,colors.furLight);line(x-10*s,y-7*s,x+9*s,y-7*s,colors.furShade,1);star(x+11*s,y-2*s,3*s,colors.moon);}
    function drawDetails(p){
      const g=friendPosition('gpt',p),a=friendPosition('astra',p);
      towel(cx,cy-101*S,.80*S,colors.moonLight);
      towel(a.x,a.y-81*S,.67*S,colors.astraLight);
      if(foamHat&&!sleeping){cloud(g.x,g.y-76*S,69*S,33*S,colors.furLight);ellipse(g.x-17*S,g.y-91*S,6*S,10*S,colors.furLight,-.25);ellipse(g.x+16*S,g.y-92*S,6*S,10*S,colors.furLight,.25);star(g.x+27*S,g.y-77*S,5*S,colors.moon);}
      else towel(g.x,g.y-75*S,.65*S,colors.mintLight);
      if(glassesFog&&!sleeping){ctx.save();ctx.globalAlpha=.78;ellipse(a.x-17*S,a.y-20*S,10*S,9*S,colors.cloud);ellipse(a.x+17*S,a.y-20*S,10*S,9*S,colors.cloud);ctx.globalAlpha=.6;line(a.x-24*S,a.y-20*S,a.x-15*S,a.y-25*S,colors.furLight,1.4);line(a.x+10*S,a.y-20*S,a.x+19*S,a.y-25*S,colors.furLight,1.4);ctx.restore();}
    }
    function drawBed(){
      const y=cy+91*S,w=Math.min(W*.94,545);ellipse(cx,y+27*S,w*.42,13*S,colors.sky);cloud(cx,y,w,70*S,colors.cloudShade);cloud(cx,y-9*S,w*.98,59*S,colors.cloud);
      ctx.save();ctx.globalAlpha=.5;cloud(cx-15*S,y-21*S,w*.82,33*S,colors.furLight);ctx.restore();
    }
    function drawSteam(now){
      if(sleeping)return;
      ctx.save();ctx.globalAlpha=.18;
      for(let i=0;i<3;i++){
        const x=cx+(i-1)*91*S,t=bath.active&&!reduced.matches?Math.sin(bath.time/1800+i)*4:0;
        path(null,()=>{ctx.moveTo(x,cy+15*S);ctx.bezierCurveTo(x-16*S,cy-5*S,x+18*S+t,cy-14*S,x,cy-36*S);},colors.furLight,3*S);
      }ctx.restore();

      steamPuffs.forEach(p=>{
        const age=reduced.matches?1700:now-p.born,t=age/3900,x=p.x,y=p.y-t*145*S;
        ctx.save();ctx.globalAlpha=Math.sin(Math.min(t,1)*Math.PI)*.85;ctx.translate(x,y);ctx.scale(S*(.65+t*.5),S*(.65+t*.5));

        else {cloud(0,0,56,29,colors.furLight);path(colors.furLight,()=>{ctx.moveTo(-20,-6);ctx.lineTo(-19,-27);ctx.lineTo(-7,-12);ctx.moveTo(7,-12);ctx.lineTo(20,-27);ctx.lineTo(21,-5);});ellipse(-9,-1,1.5,2,colors.ink);ellipse(9,-1,1.5,2,colors.ink);}
        ctx.restore();
      });
    }
    function drawMagic(now){
      particles=particles.filter(p=>now-p.born<1650);
      particles.forEach(p=>{const t=(now-p.born)/1650;ctx.save();ctx.globalAlpha=Math.sin(t*Math.PI)*.75;const x=p.x*W+p.dx*t,y=p.y*H-p.dy*t;p.heart?heart(x,y,p.r,colors.pink):star(x,y,p.r,colors.moon,t);ctx.restore();});
    }
    function draw(now){
      frame=0;if(disposed||!root.isConnected)return;
      if(!reduced.matches&&now-lastDraw<32){frame=requestAnimationFrame(draw);return;}lastDraw=now;updateBath(now);
      const p=reduced.matches?1:Math.min(1,(now-started)/(duration||1));if(p>=1)action='';
      const ct=reduced.matches?1:ease((now-cuddleAt)/650);cuddle=cuddleFrom+(cuddleTarget-cuddleFrom)*ct;
      ctx.clearRect(0,0,W,H);ctx.save();ctx.beginPath();ctx.roundRect(0,0,W,H,22);ctx.clip();
      drawRoom(now);sleeping?drawBed():drawBathBack();drawWolf(now,p);drawGPT(p);drawAstra(p);drawDetails(p);
      if(sleeping){const settle=reduced.matches?1:ease((now-sleepAt)/1500);ctx.save();ctx.translate(0,-(1-settle)*H*.13);ctx.globalAlpha=.25+.75*settle;drawSharedQuilt(p);ctx.restore();}
      else drawBathFront();
      drawSteam(now);drawMagic(now);ctx.restore();
      if(!frame&&!reduced.matches&&(bath.active&&!bath.paused||now<magicUntil||particles.length||steamPuffs.length||ct<1&&cuddle!==cuddleTarget))frame=requestAnimationFrame(draw);
    }
    root.querySelectorAll('button[data-action]').forEach(b=>b.addEventListener('click',()=>act(b.dataset.action)));
    function point(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};}
    canvas.addEventListener('pointerdown',e=>{const p=point(e);pointer={...p,last:p,id:e.pointerId,glass:onGlass(p),travel:0};if(pointer.glass)wipeAt(p);});
    canvas.addEventListener('pointermove',e=>{
      const p=point(e);gazeX=Math.max(-2,Math.min(2,(p.x-cx)/W*7));gazeY=Math.max(-1.5,Math.min(1.5,(p.y-cy)/H*5));
      if(pointer&&pointer.id===e.pointerId){
        const dist=Math.hypot(p.x-pointer.last.x,p.y-pointer.last.y);pointer.travel+=dist;
        if(pointer.glass&&dist>4){const n=Math.min(15,Math.ceil(dist/12));for(let i=1;i<=n;i++)wipeAt({x:pointer.last.x+(p.x-pointer.last.x)*i/n,y:pointer.last.y+(p.y-pointer.last.y)*i/n},34,i===n);pointer.last=p;}
      }redraw();
    });
    canvas.addEventListener('pointerup',e=>{
      const p=point(e),down=pointer;pointer=null;if(!down||down.id!==e.pointerId||down.glass||down.travel>20)return;
      const left=friendPosition('gpt'),right=friendPosition('astra');
      if(p.y>cy+47*S&&!sleeping){act('steam');return;}
      if(Math.abs(p.x-left.x)<58*S&&Math.abs(p.y-left.y)<88*S)act('gpt');
      else if(Math.abs(p.x-right.x)<58*S&&Math.abs(p.y-right.y)<88*S)act('astra');

    canvas.addEventListener('pointercancel',()=>{pointer=null;});canvas.addEventListener('pointerleave',()=>{pointer=null;gazeX=0;gazeY=0;redraw();});
    function resize(){
      const r=canvas.getBoundingClientRect();if(!r.width||!r.height)return;W=r.width;H=r.height;
      const dpr=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);
      fogCanvas.width=Math.round(W);fogCanvas.height=Math.round(H);fogDirty=true;

    }
    const observer=new ResizeObserver(resize);observer.observe(canvas);
    const themeQuery=window.matchMedia('(prefers-color-scheme: dark)');themeQuery.addEventListener('change',resize);
    const themeObserver=new MutationObserver(()=>{palette();fogDirty=true;redraw();});[document.documentElement,document.body].forEach(el=>themeObserver.observe(el,{attributes:true,attributeFilter:['class','style','data-theme']}));
    const motionChange=()=>{if(reduced.matches){action='';particles=[];steamPuffs=[];bath.active=false;bath.paused=false;}controls();redraw();};reduced.addEventListener('change',motionChange);
    const cleanup=new MutationObserver(()=>{if(!root.isConnected){disposed=true;cancelAnimationFrame(frame);observer.disconnect();themeObserver.disconnect();themeQuery.removeEventListener('change',resize);reduced.removeEventListener('change',motionChange);cleanup.disconnect();}});cleanup.observe(document.body,{childList:true,subtree:true});
    resize();controls();
  })();
