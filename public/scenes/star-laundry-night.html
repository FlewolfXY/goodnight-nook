      frame=0;if(disposed||!root.isConnected)return;
      if(!reduced.matches&&now-lastDraw<30){frame=requestAnimationFrame(draw);return;}lastDraw=now;
      if(automatic&&now>=nextStep){step();nextStep=now+4300;}
      const p=reduced.matches?1:Math.min(1,(now-started)/(duration||1));if(p>=1)action='';
      const ct=reduced.matches?1:ease((now-cuddleAt)/650);cuddle=cuddleFrom+(cuddleTarget-cuddleFrom)*ct;
      ctx.clearRect(0,0,W,H);ctx.save();ctx.beginPath();ctx.roundRect(0,0,W,H,22);ctx.clip();
      drawSky(now);drawLaundry(now);drawBed();drawWolf(now,p);drawGPT(p);drawAstra(p);
      if(sock&&!sleeping){const a=friendPosition('astra',p);sockShape(a.x+2*S,a.y-72*S,.61*S,colors.mintLight);}
      if(sleeping){
        const settle=reduced.matches?1:ease((now-sleepAt)/1800);
        ctx.save();ctx.translate(0,-(1-settle)*H*.22);ctx.globalAlpha=.25+.75*settle;drawSharedQuilt(p);ctx.restore();
        drawWhale();
      }else drawTub(now);
      drawBubbles(now);drawMagic(now);ctx.restore();
      if(!frame&&!reduced.matches&&(automatic||now<magicUntil||particles.length||ct<1&&cuddle!==cuddleTarget))frame=requestAnimationFrame(draw);
    }
    root.querySelectorAll('button[data-action]').forEach(b=>b.addEventListener('click',()=>{
      if(b.dataset.action==='wash'&&sleeping)wake();else act(b.dataset.action);
    }));
    function point(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};}
    canvas.addEventListener('pointerdown',e=>{const p=point(e);pointer={...p,id:e.pointerId,travel:0,lastX:p.x};});
    canvas.addEventListener('pointermove',e=>{
      const p=point(e);gazeX=Math.max(-2,Math.min(2,(p.x-cx)/W*7));gazeY=Math.max(-1.5,Math.min(1.5,(p.y-cy)/H*5));redraw();
      if(pointer&&pointer.id===e.pointerId){
        pointer.travel+=Math.abs(p.x-pointer.lastX);pointer.lastX=p.x;
        if(!sleeping&&stage==='wash'&&washes<3&&p.y>cy+25*S&&Math.abs(p.x-cx)<105*S&&pointer.travel>36&&performance.now()-lastRub>900){wash();lastRub=performance.now();pointer.travel=0;pointer.rubbed=true;}
      }
    });
    canvas.addEventListener('pointerup',e=>{
      const p=point(e),down=pointer;pointer=null;if(!down||down.id!==e.pointerId||down.rubbed||Math.hypot(p.x-down.x,p.y-down.y)>20)return;
      const bi=bubbles.findIndex(b=>{const q=bubblePoint(b,performance.now());return Math.hypot(p.x-q.x,p.y-q.y)<Math.max(22,q.r+5);});
      if(bi>=0){popBubble(bi);return;}
      if(Math.abs(p.x-W*.5)<38&&p.y<H*.30){act('moon');return;}
      if(!sleeping&&p.y>cy+40*S&&Math.abs(p.x-cx)<104*S){act('wash');return;}
      const left=friendPosition('gpt'),right=friendPosition('astra');
      if(Math.abs(p.x-left.x)<58*S&&Math.abs(p.y-left.y)<90*S)act('gpt');
      else if(Math.abs(p.x-right.x)<58*S&&Math.abs(p.y-right.y)<90*S)act('astra');
      else if(Math.abs(p.x-cx)<85*S&&p.y>cy-125*S)act('pet');
      else if(!sleeping){addBubble(p.x,p.y,18);caption.textContent='在夜空里点一下，就长出一颗小小的梦泡泡。';}
    });
    canvas.addEventListener('pointercancel',()=>{pointer=null;});
    canvas.addEventListener('pointerleave',()=>{pointer=null;gazeX=0;gazeY=0;redraw();});
    function resize(){
      const r=canvas.getBoundingClientRect();if(!r.width||!r.height)return;W=r.width;H=r.height;
      const dpr=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);
      S=Math.min(1,W/460);cx=W*.5;cy=H*.61;palette();redraw();
    }
    const observer=new ResizeObserver(resize);observer.observe(canvas);
    const themeQuery=window.matchMedia('(prefers-color-scheme: dark)');themeQuery.addEventListener('change',resize);
    const themeObserver=new MutationObserver(()=>{palette();redraw();});[document.documentElement,document.body].forEach(el=>themeObserver.observe(el,{attributes:true,attributeFilter:['class','style','data-theme']}));
    const motionChange=()=>{if(reduced.matches){action='';particles=[];if(automatic){washes=3;stage='dry';tuck();}}redraw();};reduced.addEventListener('change',motionChange);
    const cleanup=new MutationObserver(()=>{if(!root.isConnected){disposed=true;cancelAnimationFrame(frame);observer.disconnect();themeObserver.disconnect();themeQuery.removeEventListener('change',resize);reduced.removeEventListener('change',motionChange);cleanup.disconnect();}});cleanup.observe(document.body,{childList:true,subtree:true});
    resize();addBubble(W*.17,H*.33,20);addBubble(W*.82,H*.36,22);
  })();
  </script>
