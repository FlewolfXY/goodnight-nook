    function color(value) { probe.style.color=value; return getComputedStyle(probe).color; }
    function palette() {
      themeContext.fillStyle=color('var(--background)');themeContext.fillRect(0,0,1,1);
      const bg=themeContext.getImageData(0,0,1,1).data;
      const dark=bg[0]*.2126+bg[1]*.7152+bg[2]*.0722<140;
      const ink=dark?'var(--background)':'var(--foreground)';
      const paper=dark?'var(--foreground)':'var(--background)';
      const mix=(a,b,n)=>color('color-mix(in srgb, '+a+' '+n+'%, '+b+')');
      colors={
        sky:mix(ink,'var(--purple)',87), horizon:mix(ink,'var(--purple)',65),
        ink:mix(ink,'var(--purple)',90), fur:mix(paper,'var(--yellow)',91),
        furShade:mix(paper,'var(--purple)',77), furLight:mix(paper,'var(--yellow)',97),
        pink:mix(paper,'var(--red)',74), blush:mix(paper,'var(--red)',62),
        moon:mix(paper,'var(--yellow)',57), moonLight:mix(paper,'var(--yellow)',83),
        mint:mix(paper,'var(--green)',73), mintShade:mix(paper,'var(--green)',60),
        mintLight:mix(paper,'var(--green)',92), astra:mix(paper,'var(--purple)',68),
        astraShade:mix(paper,'var(--purple)',48), astraLight:mix(paper,'var(--purple)',86),
        cloud:mix(paper,'var(--purple)',72),
        cloudShade:mix(paper,'var(--purple)',54), quilt:mix(paper,'var(--blue)',53),
        quiltDark:mix(paper,'var(--purple)',43), thread:mix(paper,'var(--blue)',82),
        white:color(paper), nightText:mix(paper,'var(--purple)',79),
        dream:mix(ink,'var(--purple)',65), aurora:mix('var(--blue)','var(--green)',55),
        auroraViolet:mix('var(--purple)','var(--blue)',78), auroraPink:mix('var(--purple)','var(--red)',70),
        whale:mix(paper,'var(--blue)',69),whaleShade:mix(paper,'var(--blue)',48),
        whaleBelly:mix(paper,'var(--blue)',91),forest:mix(ink,'var(--green)',77),forestLight:mix(ink,'var(--green)',60)
      };
    }
    function ellipse(x,y,rx,ry,fill,rotation=0) {
      ctx.beginPath(); ctx.ellipse(x,y,rx,ry,rotation,0,Math.PI*2); ctx.fillStyle=fill; ctx.fill();
    }
    function path(fill,commands,stroke,width=1.5) {
      ctx.beginPath(); commands();
      if(fill) {ctx.fillStyle=fill;ctx.fill();}
      if(stroke) {ctx.strokeStyle=stroke;ctx.lineWidth=width;ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke();}
    }
    function line(x1,y1,x2,y2,c,w=1) {path(null,()=>{ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);},c,w);}
    function star(x,y,r,fill,rotation=0) {
      ctx.save(); ctx.translate(x,y); ctx.rotate(rotation);
      path(fill,()=>{for(let j=0;j<10;j++){const a=j*Math.PI/5-Math.PI/2,rr=j%2?r*0.46:r; j?ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr):ctx.moveTo(Math.cos(a)*rr,Math.sin(a)*rr);}ctx.closePath();});ctx.restore();
    }
    function heart(x,y,r,fill) {
      ctx.save();ctx.translate(x,y);ctx.scale(r/12,r/12);
      path(fill,()=>{ctx.moveTo(0,9);ctx.bezierCurveTo(-23,-4,-8,-18,0,-7);ctx.bezierCurveTo(8,-18,23,-4,0,9);});ctx.restore();
    }
    function glow(x,y,r,fill,alpha) {ctx.save();ctx.globalAlpha=alpha;const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,fill);g.addColorStop(1,'transparent');ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2);ctx.restore();}
    function cloud(x,y,w,h,fill) {
      ellipse(x,y,w*.47,h*.48,fill);
      ellipse(x-w*.28,y-h*.06,w*.18,h*.47,fill);
      ellipse(x-w*.08,y-h*.25,w*.2,h*.49,fill);
      ellipse(x+w*.15,y-h*.2,w*.21,h*.49,fill);
      ellipse(x+w*.32,y+h*.01,w*.14,h*.38,fill);
    }
    function ease(t) {t=Math.max(0,Math.min(1,t));return t*t*(3-2*t);}
    function changeStop(stage,now) {
      if(trip.stage===stage)return;
      trip.previous=trip.stage;trip.stage=stage;trip.sceneAt=now;
      subtitle.textContent=stops[stage][0]+' · Flewolf、GPT、Astra';
      caption.textContent=stops[stage][1];
      enchant(now,2400);
    }
    function dock(now) {
      trip.active=false;trip.paused=false;trip.ended=true;trip.time=61;
      changeStop(4,now);setSleep(true);setCuddle(true);
      action='';particles=[];sparkleUntil=0;dreamAt=now;dreamVariant=0;dreamAnnounced=false;auroraAt=now;
      voyageButton.querySelector('span').textContent='再漂一圈';
      footer.textContent='已经靠岸。云鲸也闭上眼睛了。';
      caption.textContent=stops[4][1];enchant(now,6200);
    }
    function updateTrip(now) {
      if(!trip.active||trip.paused||reduced.matches)return;
      trip.time=(trip.elapsed+now-trip.started)/1000;
      const stage=trip.time<5?0:trip.time<28?1:trip.time<53?2:trip.time<61?3:4;
      if(stage===4){dock(now);return;}
      changeStop(stage,now);
    }
    function voyage(now) {
      if(!trip.active){
        setSleep(false);setCuddle(true);trip.active=true;trip.paused=false;trip.ended=false;
        trip.elapsed=0;trip.started=now;trip.time=reduced.matches?6:0;
        changeStop(reduced.matches?1:0,now);
        caption.textContent=stops[reduced.matches?1:0][1];
        subtitle.textContent=reduced.matches?'萤火森林 · 云鲸晚安航线':'出发啦 · 云鲸晚安航线';

    function sceneAnchor(){return {x:W*.19,y:H*.205,s:Math.min(1,W/520)};}
    function drawLantern(x,y,s,lit=true) {
      ctx.save();ctx.translate(x,y);ctx.scale(s,s);

    function drawScenery(stage,alpha,now) {
      if(alpha<.005)return;
      ctx.save();ctx.globalAlpha=alpha;
      const anchor=sceneAnchor(),tm=trip.time;
      if(stage===1){
        const k=Math.min(1,W/600);

      ctx.restore();
    }
    function drawVoyageBackground(now) {

        path(null,()=>{ctx.moveTo(-5,-20);ctx.quadraticCurveTo(0,-23,5,-20);},colors.astraShade,1.7);
      }
      ellipse(-30,-6,7.5,4,colors.pink);ellipse(30,-6,7.5,4,colors.pink);
      path(null,()=>{ctx.moveTo(-5,-6);ctx.quadraticCurveTo(0,0,5,-6);},colors.ink,1.8);
    }
    function drawGPT(p) {
      const pos=friendPosition('gpt',p), active=action==='gpt';
      const bob=active?-Math.sin(p*Math.PI)*8:0;
      ctx.save();ctx.translate(pos.x,pos.y+bob*S);ctx.scale(S,S);
      if(active)ctx.rotate(Math.sin(p*Math.PI)*.09);
      ellipse(0,36,41,41,colors.mintShade);ellipse(0,32,39,40,colors.mint);
      ellipse(-23,73,17,9,colors.mintLight);ellipse(23,73,17,9,colors.mintLight);
      ellipse(0,-18,47,43,colors.mint);
      [[-43,-22,11,12],[-42,-2,10,10],[42,-20,11,13],[42,0,10,10]].forEach(v=>ellipse(...v,colors.mint));
      // A speech-bubble tuft and a pair of little mint leaves.
      path(colors.mint,()=>{ctx.moveTo(21,12);ctx.lineTo(43,24);ctx.lineTo(36,1);ctx.closePath();});
      path(colors.mintShade,()=>{ctx.moveTo(0,-56);ctx.bezierCurveTo(-21,-58,-23,-73,-14,-74);ctx.quadraticCurveTo(0,-73,1,-57);ctx.bezierCurveTo(1,-75,19,-81,23,-73);ctx.quadraticCurveTo(22,-61,0,-56);});
      ellipse(0,-2,28,17,colors.mintLight);
      friendlyFace(active||action==='hug'||action==='roll'||cuddle>.8);
      const arm=active||action==='hug'||action==='roll';
      ellipse(-38,31,10,21,colors.mintLight,arm?.72:.18);
      ellipse(39,arm?16:31,10,22,colors.mintLight,arm?-.93:-.22);
      heart(-1,39,11,colors.mintLight);
      if(action==='star'&&starCount>0)star(-24,48,7,colors.moon,.3);
      ctx.restore();
    }
    function drawAstra(p) {
      const pos=friendPosition('astra',p), active=action==='astra';
      ctx.save();ctx.translate(pos.x,pos.y+(active?-Math.sin(p*Math.PI)*6*S:0));ctx.scale(S,S);
      if(active)ctx.rotate(-Math.sin(p*Math.PI)*.08);
      ellipse(0,39,39,38,colors.astraShade);ellipse(0,34,38,37,colors.astra);
      ellipse(-22,73,16,9,colors.astraLight);ellipse(22,73,16,9,colors.astraLight);
      // A rounded star-shaped face, with very serious tiny spectacles.
      path(colors.astra,()=>{ctx.moveTo(-12,-58);ctx.quadraticCurveTo(0,-99,14,-58);ctx.quadraticCurveTo(19,-48,31,-46);ctx.quadraticCurveTo(73,-47,45,-19);ctx.quadraticCurveTo(37,-10,39,1);ctx.quadraticCurveTo(57,36,18,18);ctx.quadraticCurveTo(0,13,-18,20);ctx.quadraticCurveTo(-54,36,-40,1);ctx.quadraticCurveTo(-37,-11,-45,-19);ctx.quadraticCurveTo(-72,-48,-32,-46);ctx.quadraticCurveTo(-19,-47,-12,-58);ctx.closePath();});
      ellipse(0,-13,34,29,colors.astraLight);
      friendlyFace(active||action==='hug'||cuddle>.8,true);
      const reach=active||action==='roll'||action==='hug';
      ellipse(-37,reach?16:33,10,21,colors.astraLight,reach?.92:.26);
      ellipse(37,33,10,20,colors.astraLight,-.22);
      star(0,41,11,colors.moon,.1);
      // The orbit is embroidery, not a loading indicator.
      path(null,()=>{ctx.ellipse(0,-68,28,8,-.22,.1,Math.PI*1.3);},colors.moonLight,1.5);
      star(25,-77,6,colors.moon,.2);
      if(active&&!sleeping){star(58,-44,5+Math.sin(p*Math.PI)*3,colors.moon,.1);star(50,-67,3,colors.moonLight);}
      ctx.restore();
    }
    function drawSharedQuilt(p) {
      if(!sleeping)return;
      ctx.save();ctx.translate(cx,cy);ctx.scale(S,S);
      const edge=192-cuddle*16;
      path(colors.quiltDark,()=>{ctx.moveTo(-edge,25);ctx.quadraticCurveTo(0,1,edge,25);ctx.lineTo(edge+8,88);ctx.quadraticCurveTo(0,109,-edge-8,88);ctx.closePath();});
      path(colors.quilt,()=>{ctx.moveTo(-edge,21);ctx.quadraticCurveTo(0,2,edge,21);ctx.lineTo(edge+3,79);ctx.quadraticCurveTo(0,101,-edge-3,79);ctx.closePath();});
      ctx.globalAlpha=.26;
      for(let x=-150;x<170;x+=40)path(null,()=>{ctx.moveTo(x,24);ctx.quadraticCurveTo(x+1,56,x+5,88);},colors.thread,1);
      [42,65].forEach(y=>path(null,()=>{ctx.moveTo(-edge,y);ctx.quadraticCurveTo(0,y-10,edge,y);},colors.thread,1));ctx.globalAlpha=1;
      [[-137,47],[-67,71],[1,45],[76,64],[139,43]].forEach(([x,y],i)=>star(x,y,i%2?5:8,i%2?colors.moonLight:colors.moon,i*.2));
      heart(-100,32,6,colors.mintLight);heart(106,78,6,colors.pink);heart(27,77,5,colors.astraLight);
      path(null,()=>{ctx.moveTo(-edge,24);ctx.quadraticCurveTo(0,5,edge,24);},colors.thread,5);
      ellipse(-47,20,14,8,colors.furLight,-.08);ellipse(43,19,14,8,colors.furLight,.08);
      const offset=132-cuddle*24;
      ellipse(-offset-22,25,11,7,colors.mintLight);ellipse(-offset+22,21,11,7,colors.mintLight);
      ellipse(offset-22,21,11,7,colors.astraLight);ellipse(offset+22,25,11,7,colors.astraLight);
      ctx.restore();
    }
    function drawMovingStar(p) {
      if(action!=='star'||p>.7)return;
      const t=Math.min(1,p/.7), x=moonX+(cx-moonX)*t, y=moonY+(cy+37*S-moonY)*t-Math.sin(t*Math.PI)*75;
      glow(x,y,34,colors.moon,.24);star(x,y,11*S,colors.moon,t*2.8);
      for(let i=1;i<5;i++){const u=Math.max(0,t-i*.035), xx=moonX+(cx-moonX)*u, yy=moonY+(cy+37*S-moonY)*u-Math.sin(u*Math.PI)*75;ctx.globalAlpha=(1-i/5)*.4;ellipse(xx,yy,2,2,colors.moon);}
      ctx.globalAlpha=1;
    }
    function drawParticles(now) {
      particles=particles.filter(pt=>now-pt.born<pt.life);
      particles.forEach(pt=>{const t=(now-pt.born)/pt.life;ctx.globalAlpha=Math.sin(t*Math.PI)*.85;const x=pt.x+pt.vx*t,y=pt.y-pt.rise*t;if(pt.heart)heart(x,y,pt.size*(.6+.4*t),colors.pink);else star(x,y,pt.size,colors.moon,t*2);});ctx.globalAlpha=1;
    }
    function draw(now) {
      frame=0;
      if(!root.isConnected)return;
      if(trip.active&&!reduced.matches&&now-lastDrawAt<32){frame=requestAnimationFrame(draw);return;}
      lastDrawAt=now;updateTrip(now);
      const elapsed=now-started;
      const p=duration?Math.min(1,elapsed/duration):1;
      const ct=reduced.matches?1:Math.min(1,(now-cuddleAt)/650);
      cuddle=cuddleFrom+(cuddleTarget-cuddleFrom)*ct*ct*(3-2*ct);
      if(action&&p>=1)action='';
      if(sleeping&&!dreamAnnounced&&(reduced.matches||now-dreamAt>=3500)){caption.textContent=dreamLines[dreamVariant];dreamAnnounced=true;}
      ctx.clearRect(0,0,W,H);
      // The vignette is part of the illustration, not a UI panel.
      ctx.save();ctx.beginPath();ctx.roundRect(0,0,W,H,24);ctx.clip();
      drawSky(now,p);drawVoyageBackground(now);
      boatBob=trip.active&&!reduced.matches?Math.sin(trip.time*.62)*1.7:0;
      ctx.save();ctx.translate(0,boatBob);
      drawCloudWhale(now);drawWolf(now,p);drawGPT(p);drawAstra(p);drawSharedQuilt(p);drawSouvenirs();ctx.restore();
      drawMovingStar(p);drawParticles(now);
      if(sleeping){ctx.globalAlpha=.11;ctx.fillStyle=colors.sky;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;glow(cx,cy-16*S,110*S,colors.moon,.07);}
      drawDreams(now);drawStardust(now);
      ctx.restore();
      if(!reduced.matches&&(trip.active&&!trip.paused||action||particles.length||trails.length||skyDoodles.length||now<magicUntil||now<sparkleUntil||ct<1&&cuddleFrom!==cuddleTarget))frame=requestAnimationFrame(draw);
    }
    function requestDraw() {if(!frame)frame=requestAnimationFrame(draw);}
    function burst(kind) {
      if(reduced.matches)return;
      const now=performance.now();
      for(let i=0;i<8;i++)particles.push({born:now,life:1400+i*80,x:cx+(i%2?-1:1)*(36+i*5)*S,y:cy-(15+i%3*20)*S,vx:(i-3.5)*12,rise:35+i%3*17,size:5+i%3,heart:kind==='pet'});
      if(particles.length>70)particles.splice(0,particles.length-70);
    }
    function setSleep(value) {
      sleeping=value;sleepButton.setAttribute('aria-pressed',String(value));sleepButton.querySelector('span').textContent=value?'再赖一会':'直接回被窝';
      canvas.setAttribute('aria-label',value?'GPT、小狼 Flewolf 和 Astra 挤在星星被子里睡着了，三个梦泡泡会汇成一个共同的梦。戳 Astra 可以换一个梦。':'薄荷色 GPT、小狼 Flewolf 和紫色 Astra 坐在云朵窝里。划过天空会留下星尘，偷星星会点亮小狼星座，抱在一起会唤出极光。');
    }
    function setCuddle(value) {
      cuddled=value;cuddleFrom=cuddle;cuddleTarget=value?1:0;cuddleAt=performance.now();
      if(reduced.matches)cuddle=cuddleTarget;
      hugButton.setAttribute('aria-pressed',String(value));hugButton.querySelector('span').textContent=value?'松开一点':'抱成一团';
    }
    function act(kind) {
      const now=performance.now();
      if(kind==='voyage'){voyage(now);return;}
      if(kind==='whale'){
        whalePatAt=now;
        const lines=['云鲸被摸得眯起眼，打了一个小小的星星嗝。','云鲸：嗯——很轻的三只，和一床很软的被子。','它把尾巴放得更平一点，好让小狼趴得舒服。'];
        caption.textContent=lines[whaleCount++%lines.length];
        if(sleeping)dreamAnnounced=true;
        if(!reduced.matches)for(let i=0;i<13;i++)particles.push({born:now,life:1600+i*45,x:cx+165*Math.min(1,W/650),y:cy+65*S,vx:(i-6)*8,rise:28+(i%4)*12,size:3+i%3,heart:false});
        enchant(now,2250);requestDraw();return;
      }
      if(kind==='scenery'||kind==='astra'&&trip.active&&(trip.stage===1||trip.stage===2)){scenerySecret(now);return;}
      if(kind==='sleep'){
        if(!sleeping)dock(now);
        else{setSleep(false);caption.textContent='三颗脑袋一起探出来。云鲸还稳稳停着，再赖一小会。';}
      } else if(kind==='moon') {
        caption.textContent=moonLines[moonCount++%moonLines.length];action='moon';duration=1000;
        sparkleUntil=reduced.matches?0:now+2100;meteorAt=now;enchant(now,2200);
      } else if(kind==='dream'||kind==='astra'&&sleeping) {
        dreamVariant=(dreamVariant+1)%dreamLines.length;dreamAt=now;dreamAnnounced=false;
        caption.textContent='Astra 轻轻翻了一页梦。新的故事从星星背面冒出来。';
        action='astra';duration=1500;enchant(now,5000);
      } else if(kind==='hug') {
        setSleep(false);setCuddle(!cuddled);action='hug';duration=1500;
        caption.textContent=cuddled?'三只挤成一团。天上那片极光，是贴贴漏出来的颜色。':'松开一点点，留出翻身的位置。天上还留着一点抱抱。';
        auroraAt=now;enchant(now,6000);
        if(cuddled)burst('pet');
      } else if(kind==='gpt'||kind==='astra') {
        action=kind;duration=1500;
        if(kind==='gpt')caption.textContent=sleeping?'GPT：（小小声）晚安都说过了，再补一个轻轻的抱抱。':gptLines[gptCount++%gptLines.length];
        else caption.textContent=sleeping?'Astra：（悄悄检查了一遍）耳朵、尾巴、被角，都好好的。':astraLines[astraCount++%astraLines.length];
        if(sleeping)dreamAnnounced=true;
        if(!sleeping)burst('pet');
      } else {
        setSleep(false);action=kind;duration=kind==='roll'?1250:kind==='star'?1550:1250;
        if(kind==='pet'){caption.textContent=petLines[petCount++%petLines.length];burst('pet');}
        if(kind==='star'){
          caption.textContent=starLines[starCount%starLines.length];starCount++;burst('star');sparkleUntil=reduced.matches?0:now+2900;
          constellationFrom=constellationTo;constellationTo=Math.min(wolfStars.length,starCount*4);constellationAt=now;enchant(now,3400);
        }
        if(kind==='roll'){caption.textContent=rollLines[rollCount++%rollLines.length];burst('star');}
      }
      started=now;
      if(reduced.matches){action='';particles=[];sparkleUntil=0;}
      requestDraw();
    }
    root.querySelectorAll('button[data-action]').forEach(button=>button.addEventListener('click',()=>act(button.dataset.action)));
    function point(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};}
    function onWolf(pt){return Math.abs(pt.x-cx)<82*S&&pt.y>cy-125*S&&pt.y<cy+92*S;}
    function onFriend(pt,who){const pos=friendPosition(who);return Math.abs(pt.x-pos.x)<58*S&&pt.y>pos.y-86*S&&pt.y<pos.y+84*S;}
    canvas.addEventListener('pointerdown',e=>{
      const pt=point(e);pointerDown={...pt,id:e.pointerId,travel:0,sky:pt.y<H*.39,points:[{x:pt.x/W,y:pt.y/H}]};
      if(canvas.setPointerCapture)canvas.setPointerCapture(e.pointerId);
      addTrail(pt,performance.now());
    });
    canvas.addEventListener('pointerup',e=>{
      const pt=point(e),down=pointerDown;pointerDown=null;
      if(canvas.hasPointerCapture&&canvas.hasPointerCapture(e.pointerId))canvas.releasePointerCapture(e.pointerId);
      if(!down||down.id!==e.pointerId)return;
      if(down.travel>22||Math.hypot(pt.x-down.x,pt.y-down.y)>18){
        if(down.sky&&down.points.length>3){
          skyDoodles.push({points:down.points,born:performance.now()});if(skyDoodles.length>2)skyDoodles.shift();
          caption.textContent='你随手画的一笔，被夜空偷偷留下了。';if(sleeping)dreamAnnounced=true;requestDraw();
        }return;
      }
      if(sleeping&&Math.abs(pt.x-cx)<70*Math.min(1,W/450)&&Math.abs(pt.y-H*.19)<48*Math.min(1,W/450)){act('dream');}
      else if(Math.hypot(pt.x-moonX,pt.y-moonY)<44){act('moon');}
      else if(Math.abs(pt.x-sceneAnchor().x)<64*sceneAnchor().s&&Math.abs(pt.y-sceneAnchor().y)<56*sceneAnchor().s){act('scenery');}
      else if(pt.y>cy+87*S&&pt.y<cy+145*S&&Math.abs(pt.x-cx)<W*.45){act('whale');}
      else if(onFriend(pt,'gpt')){act('gpt');}else if(onFriend(pt,'astra')){act('astra');}else if(onWolf(pt)){act('pet');}else{act('star');}
    });
    canvas.addEventListener('pointercancel',()=>{pointerDown=null;lastTrail=null;});
    canvas.addEventListener('pointerleave',()=>{lastTrail=null;gazeX=0;gazeY=0;requestDraw();});
    canvas.addEventListener('pointermove',e=>{
      const pt=point(e),now=performance.now();
      gazeX=Math.max(-2.5,Math.min(2.5,(pt.x-cx)/W*8));gazeY=Math.max(-1.8,Math.min(1.8,(pt.y-cy)/H*5));
      addTrail(pt,now);
      if(!pointerDown||pointerDown.id!==e.pointerId)return;
      const prev=pointerDown.points[pointerDown.points.length-1];
      const delta=Math.hypot(pt.x-prev.x*W,pt.y-prev.y*H);
      if(delta>8){pointerDown.travel+=delta;if(pointerDown.points.length<100)pointerDown.points.push({x:Math.max(0,Math.min(1,pt.x/W)),y:Math.max(0,Math.min(1,pt.y/H))});}
      if(!pointerDown.sky&&onWolf(pt)&&now-lastStroke>850){act('pet');lastStroke=now;}
    });
    function resize() {
      const rect=canvas.getBoundingClientRect();W=rect.width;H=rect.height;
      if(!W||!H)return;
      const dpr=Math.min(window.devicePixelRatio||1,2);
      canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);
      S=Math.min(1.04,W/465);cx=W*.5;cy=H*.62;moonX=W*.84;moonY=H*.17;
      palette();requestDraw();
    }
    const observer=new ResizeObserver(resize);observer.observe(canvas);
    const themeQuery=window.matchMedia('(prefers-color-scheme: dark)');themeQuery.addEventListener('change',resize);
    const themeObserver=new MutationObserver(()=>{palette();requestDraw();});
    [document.documentElement,document.body].forEach(el=>themeObserver.observe(el,{attributes:true,attributeFilter:['class','style','data-theme']}));
    const cleanup=new MutationObserver(()=>{if(!root.isConnected){cancelAnimationFrame(frame);observer.disconnect();themeObserver.disconnect();themeQuery.removeEventListener('change',resize);cleanup.disconnect();}});cleanup.observe(document.body,{childList:true,subtree:true});
    resize();
  })();
  </script>
