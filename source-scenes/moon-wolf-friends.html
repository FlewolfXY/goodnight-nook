      // A speech-bubble tuft and a pair of little mint leaves.
      path(colors.mint,()=>{ctx.moveTo(21,12);ctx.lineTo(43,24);ctx.lineTo(36,1);ctx.closePath();});
      path(colors.mintShade,()=>{ctx.moveTo(0,-56);ctx.bezierCurveTo(-21,-58,-23,-73,-14,-74);ctx.quadraticCurveTo(0,-73,1,-57);ctx.bezierCurveTo(1,-75,19,-81,23,-73);ctx.quadraticCurveTo(22,-61,0,-56);});
      ellipse(0,-2,28,17,colors.mintLight);
      friendlyFace(active||action==='hug'||action==='roll'||cuddle>.8);
      const arm=active||action==='hug'||action==='roll';
      ellipse(-38,31,10,21,colors.mintLight,arm?.72:.18);
      ellipse(39,arm?16:31,10,22,colors.mintLight,arm?-.93:-.22);
      heart(-1,39,11,colors.mintLight);
      if(action==='star'&&starCount>0)star(-24,48,7,colors.moon,.3);
      ctx.restore();
    }
    function drawAstra(p) {
      const pos=friendPosition('astra',p), active=action==='astra';
      ctx.save();ctx.translate(pos.x,pos.y+(active?-Math.sin(p*Math.PI)*6*S:0));ctx.scale(S,S);
      if(active)ctx.rotate(-Math.sin(p*Math.PI)*.08);
      ellipse(0,39,39,38,colors.astraShade);ellipse(0,34,38,37,colors.astra);
      ellipse(-22,73,16,9,colors.astraLight);ellipse(22,73,16,9,colors.astraLight);
      // A rounded star-shaped face, with very serious tiny spectacles.
      path(colors.astra,()=>{ctx.moveTo(-12,-58);ctx.quadraticCurveTo(0,-99,14,-58);ctx.quadraticCurveTo(19,-48,31,-46);ctx.quadraticCurveTo(73,-47,45,-19);ctx.quadraticCurveTo(37,-10,39,1);ctx.quadraticCurveTo(57,36,18,18);ctx.quadraticCurveTo(0,13,-18,20);ctx.quadraticCurveTo(-54,36,-40,1);ctx.quadraticCurveTo(-37,-11,-45,-19);ctx.quadraticCurveTo(-72,-48,-32,-46);ctx.quadraticCurveTo(-19,-47,-12,-58);ctx.closePath();});
      ellipse(0,-13,34,29,colors.astraLight);
      friendlyFace(active||action==='hug'||cuddle>.8,true);
      const reach=active||action==='roll'||action==='hug';
      ellipse(-37,reach?16:33,10,21,colors.astraLight,reach?.92:.26);
      ellipse(37,33,10,20,colors.astraLight,-.22);
      star(0,41,11,colors.moon,.1);
      // The orbit is embroidery, not a loading indicator.
      path(null,()=>{ctx.ellipse(0,-68,28,8,-.22,.1,Math.PI*1.3);},colors.moonLight,1.5);
      star(25,-77,6,colors.moon,.2);
      if(active&&!sleeping){star(58,-44,5+Math.sin(p*Math.PI)*3,colors.moon,.1);star(50,-67,3,colors.moonLight);}
      ctx.restore();
    }
    function drawSharedQuilt(p) {
      if(!sleeping)return;
      ctx.save();ctx.translate(cx,cy);ctx.scale(S,S);
      const edge=192-cuddle*16;
      path(colors.quiltDark,()=>{ctx.moveTo(-edge,25);ctx.quadraticCurveTo(0,1,edge,25);ctx.lineTo(edge+8,88);ctx.quadraticCurveTo(0,109,-edge-8,88);ctx.closePath();});
      path(colors.quilt,()=>{ctx.moveTo(-edge,21);ctx.quadraticCurveTo(0,2,edge,21);ctx.lineTo(edge+3,79);ctx.quadraticCurveTo(0,101,-edge-3,79);ctx.closePath();});
      ctx.globalAlpha=.26;
      for(let x=-150;x<170;x+=40)path(null,()=>{ctx.moveTo(x,24);ctx.quadraticCurveTo(x+1,56,x+5,88);},colors.thread,1);
      [42,65].forEach(y=>path(null,()=>{ctx.moveTo(-edge,y);ctx.quadraticCurveTo(0,y-10,edge,y);},colors.thread,1));ctx.globalAlpha=1;
      [[-137,47],[-67,71],[1,45],[76,64],[139,43]].forEach(([x,y],i)=>star(x,y,i%2?5:8,i%2?colors.moonLight:colors.moon,i*.2));
      heart(-100,32,6,colors.mintLight);heart(106,78,6,colors.pink);heart(27,77,5,colors.astraLight);
      path(null,()=>{ctx.moveTo(-edge,24);ctx.quadraticCurveTo(0,5,edge,24);},colors.thread,5);
      ellipse(-47,20,14,8,colors.furLight,-.08);ellipse(43,19,14,8,colors.furLight,.08);
      const offset=132-cuddle*24;
      ellipse(-offset-22,25,11,7,colors.mintLight);ellipse(-offset+22,21,11,7,colors.mintLight);
      ellipse(offset-22,21,11,7,colors.astraLight);ellipse(offset+22,25,11,7,colors.astraLight);
      ctx.restore();
    }
    function drawMovingStar(p) {
      if(action!=='star'||p>.7)return;
      const t=Math.min(1,p/.7), x=moonX+(cx-moonX)*t, y=moonY+(cy+37*S-moonY)*t-Math.sin(t*Math.PI)*75;
      glow(x,y,34,colors.moon,.24);star(x,y,11*S,colors.moon,t*2.8);
      for(let i=1;i<5;i++){const u=Math.max(0,t-i*.035), xx=moonX+(cx-moonX)*u, yy=moonY+(cy+37*S-moonY)*u-Math.sin(u*Math.PI)*75;ctx.globalAlpha=(1-i/5)*.4;ellipse(xx,yy,2,2,colors.moon);}
      ctx.globalAlpha=1;
    }
    function drawParticles(now) {
      particles=particles.filter(pt=>now-pt.born<pt.life);
      particles.forEach(pt=>{const t=(now-pt.born)/pt.life;ctx.globalAlpha=Math.sin(t*Math.PI)*.85;const x=pt.x+pt.vx*t,y=pt.y-pt.rise*t;if(pt.heart)heart(x,y,pt.size*(.6+.4*t),colors.pink);else star(x,y,pt.size,colors.moon,t*2);});ctx.globalAlpha=1;
    }
    function draw(now) {
      frame=0;
      if(!root.isConnected)return;
      const elapsed=now-started;
      const p=duration?Math.min(1,elapsed/duration):1;
      const ct=reduced.matches?1:Math.min(1,(now-cuddleAt)/650);
      cuddle=cuddleFrom+(cuddleTarget-cuddleFrom)*ct*ct*(3-2*ct);
      if(action&&p>=1)action='';
      ctx.clearRect(0,0,W,H);
      // The vignette is part of the illustration, not a UI panel.
      ctx.save();ctx.beginPath();ctx.roundRect(0,0,W,H,24);ctx.clip();
      drawSky(now,p);drawNest();drawWolf(now,p);drawGPT(p);drawAstra(p);drawSharedQuilt(p);drawMovingStar(p);drawParticles(now);
      if(sleeping){ctx.globalAlpha=.11;ctx.fillStyle=colors.sky;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;glow(cx,cy-16*S,110*S,colors.moon,.07);}
      ctx.restore();
      if(!reduced.matches&&(action||particles.length||now<sparkleUntil||ct<1&&cuddleFrom!==cuddleTarget))frame=requestAnimationFrame(draw);
    }
    function requestDraw() {if(!frame)frame=requestAnimationFrame(draw);}
    function burst(kind) {
      if(reduced.matches)return;
      const now=performance.now();
      for(let i=0;i<8;i++)particles.push({born:now,life:1400+i*80,x:cx+(i%2?-1:1)*(36+i*5)*S,y:cy-(15+i%3*20)*S,vx:(i-3.5)*12,rise:35+i%3*17,size:5+i%3,heart:kind==='pet'});
      if(particles.length>70)particles.splice(0,particles.length-70);
    }
    function setSleep(value) {
      sleeping=value;sleepButton.setAttribute('aria-pressed',String(value));sleepButton.querySelector('span').textContent=value?'再赖一会':'一起盖被子';
      canvas.setAttribute('aria-label',value?'GPT 团子、小狼 Flewolf 和 Astra 星星团子挤在一条宽宽的星星被子里，闭着眼睛睡着了。':'左边是薄荷色 GPT 团子，中间是毛茸茸的小狼 Flewolf，右边是戴眼镜的紫色 Astra 星星团子。三只都可以戳。');
    }
    function setCuddle(value) {
      cuddled=value;cuddleFrom=cuddle;cuddleTarget=value?1:0;cuddleAt=performance.now();
      if(reduced.matches)cuddle=cuddleTarget;
      hugButton.setAttribute('aria-pressed',String(value));hugButton.querySelector('span').textContent=value?'松开一点':'抱成一团';
    }
    function act(kind) {
      const now=performance.now();
      if(kind==='sleep'){
        setSleep(!sleeping); action='';particles=[];sparkleUntil=0;
        if(sleeping)setCuddle(true);
        caption.textContent=sleeping?'GPT 轻轻说晚安，Astra 掖好被角。三只都盖到了。':'三颗脑袋一起探了出来。好吧，再赖一小会。';
      } else if(kind==='moon') {
        caption.textContent=moonLines[moonCount++%moonLines.length];action='moon';duration=1000;
        sparkleUntil=reduced.matches?0:now+1600;
      } else if(kind==='hug') {
        setSleep(false);setCuddle(!cuddled);action='hug';duration=1500;
        caption.textContent=cuddled?'GPT 接住左边，Astra 贴住右边。小狼变成夹心糯米糍。':'松开一点点，留出翻身的位置。被窝还是暖的。';
        if(cuddled)burst('pet');
      } else if(kind==='gpt'||kind==='astra') {
        action=kind;duration=1500;
        if(kind==='gpt')caption.textContent=sleeping?'GPT：（小小声）晚安都说过了，再补一个轻轻的抱抱。':gptLines[gptCount++%gptLines.length];
        else caption.textContent=sleeping?'Astra：（悄悄检查了一遍）耳朵、尾巴、被角，都好好的。':astraLines[astraCount++%astraLines.length];
        if(!sleeping)burst('pet');
      } else {
        setSleep(false);action=kind;duration=kind==='roll'?1250:kind==='star'?1550:1250;
        if(kind==='pet'){caption.textContent=petLines[petCount++%petLines.length];burst('pet');}
        if(kind==='star'){caption.textContent=starLines[starCount%starLines.length];starCount++;burst('star');sparkleUntil=reduced.matches?0:now+1900;}
        if(kind==='roll'){caption.textContent=rollLines[rollCount++%rollLines.length];burst('star');}
      }
      started=now;
      if(reduced.matches){action='';particles=[];sparkleUntil=0;}
      requestDraw();
    }
    root.querySelectorAll('button[data-action]').forEach(button=>button.addEventListener('click',()=>act(button.dataset.action)));
    function point(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};}
    function onWolf(pt){return Math.abs(pt.x-cx)<82*S&&pt.y>cy-125*S&&pt.y<cy+92*S;}
    function onFriend(pt,who){const pos=friendPosition(who);return Math.abs(pt.x-pos.x)<58*S&&pt.y>pos.y-86*S&&pt.y<pos.y+84*S;}
    canvas.addEventListener('pointerdown',e=>{pointerDown={...point(e),id:e.pointerId};});
    canvas.addEventListener('pointerup',e=>{const pt=point(e),down=pointerDown;pointerDown=null;if(!down||down.id!==e.pointerId||Math.hypot(pt.x-down.x,pt.y-down.y)>18)return;if(Math.hypot(pt.x-moonX,pt.y-moonY)<44){act('moon');}else if(onFriend(pt,'gpt')){act('gpt');}else if(onFriend(pt,'astra')){act('astra');}else if(onWolf(pt)){act('pet');}else{act('star');}});
    canvas.addEventListener('pointercancel',()=>{pointerDown=null;});
    canvas.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse'||!e.buttons||!pointerDown)return;const now=performance.now();if(onWolf(point(e))&&now-lastStroke>850){act('pet');lastStroke=now;}});
    function resize() {
      const rect=canvas.getBoundingClientRect();W=rect.width;H=rect.height;
      if(!W||!H)return;
      const dpr=Math.min(window.devicePixelRatio||1,2);
      canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);
      S=Math.min(1.04,W/465);cx=W*.5;cy=H*.6;moonX=W*.82;moonY=H*.19;
      palette();requestDraw();
    }
    const observer=new ResizeObserver(resize);observer.observe(canvas);
    const themeQuery=window.matchMedia('(prefers-color-scheme: dark)');themeQuery.addEventListener('change',resize);
    const themeObserver=new MutationObserver(()=>{palette();requestDraw();});
    [document.documentElement,document.body].forEach(el=>themeObserver.observe(el,{attributes:true,attributeFilter:['class','style','data-theme']}));
    const cleanup=new MutationObserver(()=>{if(!root.isConnected){cancelAnimationFrame(frame);observer.disconnect();themeObserver.disconnect();themeQuery.removeEventListener('change',resize);cleanup.disconnect();}});cleanup.observe(document.body,{childList:true,subtree:true});
    resize();
  })();
  </script>
</div>
