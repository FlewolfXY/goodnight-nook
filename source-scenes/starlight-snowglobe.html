<div id="starlight-snowglobe">

  <div class="sg-cast">
    <button type="button" class="btn btn-ghost" data-action="gpt">GPT 接雪花</button>
    <button type="button" class="btn btn-ghost" data-action="hug" aria-pressed="false"><i data-lucide="heart" aria-hidden="true"></i> 挨紧一点</button>
    <button type="button" class="btn btn-ghost" data-action="astra">Astra 拨极光</button>
  </div>
  <div class="sg-caption" aria-live="polite" aria-atomic="true">三只刚泡暖，就钻进了星雪球。这里的雪，落到手心会变成棉花。</div>
  <div class="viz-controls sg-controls">
    <button type="button" class="btn btn-primary" data-action="shake"><i data-lucide="snowflake" aria-hidden="true"></i> <span>轻轻摇一摇</span></button>
    <button type="button" class="btn" data-action="snow"><i data-lucide="sparkles" aria-hidden="true"></i> <span>换成爱心雪</span></button>
    <button type="button" class="btn" data-action="sleep"><i data-lucide="moon" aria-hidden="true"></i> <span>小灯调暗</span></button>
  </div>
  <div class="sg-footer text-small text-muted">一场约十八秒的小雪 · 雪停了，三只就窝好</div>
  <style>

    #starlight-snowglobe .sg-footer { text-align:center; margin-top:14px; }
    #starlight-snowglobe .sg-probe { display:none; }
    @media(max-width:440px) { #starlight-snowglobe .sg-scene { height:400px; } }

    function wake(){

    function act(kind){

    function globePath(){const a=Math.asin(.76);ctx.beginPath();ctx.ellipse(cx,gy,rx,ry,0,a,Math.PI-a,true);ctx.closePath();}

    function pine(x,y,s){

    function drawHouse(){

    function drawLandscape(now){

    function flake(x,y,r,i){
      const c=[colors.moonLight,colors.astraLight,colors.mintLight][i%3];

    function drawSnow(now,front){

    }
    function drawBed(){
      const y=cy+91*S,w=360*S;cloud(cx,y,w,52*S,colors.furShade);cloud(cx,y-11*S,w,46*S,colors.furLight);
    }
    function drawWhalePillow(){
      const p=friendPosition('gpt');ctx.save();ctx.translate(p.x,p.y+43*S);ctx.scale(S*.51,S*.51);

    function drawFriends(now,p){
      drawBed();drawWolf(now,p);drawGPT(p);drawAstra(p);
      if(!sleeping){drawWhalePillow();if(gptCount){const q=friendPosition('gpt',p);star(q.x-6*S,q.y-78*S,7*S,colors.moon,.15);}}

    }
    function drawGlass(){
      ctx.save();ctx.globalAlpha=.58;globePath();ctx.strokeStyle=colors.thread;ctx.lineWidth=1.5;ctx.stroke();

      ctx.globalAlpha=.45;path(null,()=>ctx.ellipse(cx,gy,rx-11,ry-10,0,3.62,4.16),colors.furLight,2.5);
      ctx.globalAlpha=.13;path(null,()=>ctx.ellipse(cx,gy,rx-10,ry-10,0,5.44,6.03),colors.furLight,7);ctx.restore();

    function drawParticles(now){particles=particles.filter(p=>now-p.born<1800);particles.forEach((p,i)=>{const t=(now-p.born)/1800;ctx.save();ctx.globalAlpha=Math.sin(t*Math.PI)*.7;p.hearts?heart(p.x*W+p.dx*t,p.y*H-p.dy*t,p.r,colors.pink):flake(p.x*W+p.dx*t,p.y*H-p.dy*t,p.r,i);ctx.restore();});}
    function draw(now){
      frame=0;if(disposed||!root.isConnected)return;
      if(!reduced.matches&&now-lastDraw<32){frame=requestAnimationFrame(draw);return;}lastDraw=now;updateSnow(now);

    root.querySelectorAll('button[data-action]').forEach(b=>b.addEventListener('click',()=>act(b.dataset.action)));
    function point(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};}
    canvas.addEventListener('pointerdown',e=>{const p=point(e);pointer={...p,last:p,id:e.pointerId,travel:0};});
    canvas.addEventListener('pointermove',e=>{
      const p=point(e);gazeX=Math.max(-2,Math.min(2,(p.x-cx)/W*7));gazeY=Math.max(-1.5,Math.min(1.5,(p.y-cy)/H*5));

    canvas.addEventListener('pointerup',e=>{
